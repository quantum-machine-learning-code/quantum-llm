[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-llm"
version = "0.2.0"
description = "Controlled methodological benchmarks of variational quantum circuit layers on modulo-112 addition and toy character-level language modeling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pennylane>=0.40,<0.50",
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/quantum-machine-learning-code/quantum-llm"
Repository = "https://github.com/quantum-machine-learning-code/quantum-llm"
Issues = "https://github.com/quantum-machine-learning-code/quantum-llm/issues"

[tool.setuptools]
packages = ["qml_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["smoke_test.py", "test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"experiments/*.py" = ["E402"]
"tests/*.py" = ["E402"]
